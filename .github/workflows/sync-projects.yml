name: Sync Projects to Blog

on:
  schedule:
    - cron: '0 6 * * *'      # 每天 UTC 6:00（北京时间 14:00）自动拉取
  workflow_dispatch:           # 手动触发按钮

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 写入博客仓库

    steps:
      - name: Checkout blog source (hexo branch)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Hexo deps
        run: npm install

      - name: Fetch projects from GitHub API
        env:
          GITHUB_TOKEN: *** secrets.HEXO_PROJECTS_SYNC }}
        run: |
          node scripts/sync-projects.js

      - name: Generate and Deploy
        run: |
          npx hexo clean
          npx hexo generate
          npx hexo deploy

      - name: Commit updated project data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/projects/index.md
          git diff --cached --quiet || git commit -m "chore: sync projects from availblemy/projects"
          git push
