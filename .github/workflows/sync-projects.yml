name: Sync Projects to Blog

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.HEXO_PROJECTS_SYNC }}

    steps:
      - name: Checkout blog source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Hexo deps
        run: npm install --legacy-peer-deps

      - name: Configure Git identity (global)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch projects from GitHub API
        run: |
          node scripts/sync-projects.js

      - name: Generate and Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.HEXO_PROJECTS_SYNC }}
        run: |
          npx hexo clean
          npx hexo generate
          # Inject token into deploy URL for auth
          sed -i "s|repo: https://github.com/availblemy/availblemy.github.io.git|repo: https://x-access-token:${GITHUB_TOKEN}@github.com/availblemy/availblemy.github.io.git|" _config.yml
          npx hexo deploy

      - name: Commit updated project data
        run: |
          git add source/projects/index.md
          git diff --cached --quiet || git commit -m "chore: sync projects from availblemy/projects"
          git push
